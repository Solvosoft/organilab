{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="row justify-content-center mt-4">
	<div class="col-md-5">
		<div class="card border-danger">
			<div class="card-header text-danger"><i class="fa fa-trash"></i> {% trans 'Delete IPER assessment' %}</div>
			<div class="card-body">
				<p>{{ object }}</p>
				<form method="post">
					{% csrf_token %}
					<a href="{% url 'riskmanagement:iper_list' org_pk %}" class="btn btn-secondary">{% trans 'Cancel' %}</a>
					<button type="submit" class="btn btn-danger ms-2">{% trans 'Delete permanently' %}</button>
				</form>
			</div>
		</div>
	</div>
</div>
{% endblock %}
