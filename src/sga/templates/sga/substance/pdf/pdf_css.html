{% load static i18n %}
{% comment %}
Estilos de la hoja de seguridad para xhtml2pdf (presentation.pdf.html_to_pdf):
CSS 2.1, encabezado y pie en frames estáticos, columnas como tablas.
{% endcomment %}
<style>
@page {
    size: a4 portrait;
    margin: 2.2cm 1cm 1.8cm 1cm;

    @frame header_frame {
        -pdf-frame-content: header_content;
        top: 0.6cm;
        left: 1cm;
        right: 1cm;
        height: 1.4cm;
    }

    @frame footer_frame {
        -pdf-frame-content: footer_content;
        bottom: 0.5cm;
        left: 1cm;
        right: 1cm;
        height: 1cm;
    }
}

body {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 9pt;
}

#header_content td, #footer_content td {
    font-size: 9pt;
    border: none;
    vertical-align: middle;
}

.fw-bold {
    font-weight: bold;
}

.text-danger {
    color: red;
}

.text-left {
    text-align: right;
}

.container {
    margin-left: 4%;
    width: 90%;
}

ol {
    list-style-type: lower-alpha;
}

#header .container p {
    font-size: 9pt;
    margin: 0;
    padding: 0;
    text-align: right;
}

table {
    border-collapse: collapse;
}

th {
    background-color: #D3D3D3;
    text-align: center;
}

table, th, td {
    border: 0.5pt solid #666666;
    padding: 2pt;
}

/* Filas de dato (etiqueta + valor): tablas de maquetación sin bordes. */
table.row {
    width: 100%;
}

table.row td {
    border: none;
    padding: 1pt 2pt;
    vertical-align: top;
}

td.col-3 {
    width: 36%;
}

td.col-6 {
    width: 50%;
}

td.col-9 {
    width: 64%;
}
</style>
